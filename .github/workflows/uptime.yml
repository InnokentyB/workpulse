name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: production-uptime
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    name: Check public app and health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_BASE_URL: ${{ vars.WORKPULSE_PRODUCTION_URL }}

    steps:
      - name: Require production URL
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "Set the WORKPULSE_PRODUCTION_URL repository variable."
            exit 1
          fi

      - name: Check public page
        run: curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --max-time 20 "$APP_BASE_URL/" > /dev/null

      - name: Check application health
        run: |
          response="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --max-time 20 "$APP_BASE_URL/api/health")"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.status!=="ok"||body.service!=="workpulse") process.exit(1)' "$response"
